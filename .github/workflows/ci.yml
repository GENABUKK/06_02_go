name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v -o dummy-server.bin ./cmd/...

    - name: Test
      run: |
        ./dummy-server.bin &
        sleep 3
        curl http://localhost:8080

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dummy-server
        path: dummy-server.bin
